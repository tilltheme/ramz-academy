# أكاديمية رمـز — academy.ramz.net.sa — before its certificate (HTTP only).
# A new, separate server block: it answers only to academy.ramz.net.sa (no default_server, no other name),
# serves static files from /srv/academy, and leaves every other server block on this machine as it is.
server {
    listen 80;
    server_name academy.ramz.net.sa;

    root /srv/academy/site;
    index index.html;

    # Let's Encrypt proves the name here (certbot --webroot); nothing else is served from this folder
    location ^~ /.well-known/acme-challenge/ { root /srv/academy/acme; default_type text/plain; }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;

    access_log /var/log/nginx/academy.access.log;
    error_log  /var/log/nginx/academy.error.log warn;
}
