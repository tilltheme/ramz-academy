# أكاديمية رمـز — academy.ramz.net.sa — after its certificate (HTTPS, HTTP redirects).
# Same rules as academy-http.conf: its own name only, its own folder, its own certificate, its own logs.
server {
    listen 80;
    server_name academy.ramz.net.sa;
    location ^~ /.well-known/acme-challenge/ { root /srv/academy/acme; default_type text/plain; }
    location / { return 301 https://academy.ramz.net.sa$request_uri; }
}

server {
    listen 443 ssl;
    server_name academy.ramz.net.sa;

    ssl_certificate     /etc/letsencrypt/live/academy.ramz.net.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.ramz.net.sa/privkey.pem;

    root /srv/academy/site;
    index index.html;

    # The site is static and talks to no server: it loads only its own files.
    # Inline scripts and styles are part of the pages, hence 'unsafe-inline'; nothing is fetched from elsewhere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;   # this name only — no includeSubDomains
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / { try_files $uri $uri/ =404; }
    location /assets/ { try_files $uri =404; expires 7d; }
    error_page 404 /404.html;

    access_log /var/log/nginx/academy.access.log;
    error_log  /var/log/nginx/academy.error.log warn;
}
